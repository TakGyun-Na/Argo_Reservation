<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>아르고 예약 대장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --paper:#F1EEE3;
    --card:#FBFAF5;
    --ink:#22344B;
    --ink-soft:#3E4E63;
    --accent:#8B3A3A;
    --accent-dark:#6E2E2E;
    --sage:#55704F;
    --sage-bg:#E4EBDE;
    --ochre:#A9762C;
    --ochre-bg:#F1E4CB;
    --cancel:#8A8478;
    --cancel-bg:#E9E6DC;
    --rule:#DBD5C3;
    --text-muted:#6B675C;
    --sat-blue:#35588C;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    background-image:
      linear-gradient(var(--paper) 0, var(--paper) 100%),
      repeating-linear-gradient(180deg, rgba(34,52,75,0.025) 0px, rgba(34,52,75,0.025) 1px, transparent 1px, transparent 34px);
    font-family:'Inter', sans-serif;
    color:var(--ink);
    min-height:100vh;
    padding:40px 20px 80px;
  }
  .wrap{
    max-width:680px;
    margin:0 auto;
  }
  .masthead{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:28px;
    padding-left:4px;
  }
  .masthead h1{
    font-family:'Roboto Slab', serif;
    font-weight:700;
    font-size:26px;
    letter-spacing:0.2px;
    margin:0;
    color:var(--ink);
  }
  .masthead span{
    font-size:12.5px;
    color:var(--text-muted);
  }
  .tabs{
    display:flex;
    gap:6px;
    padding-left:14px;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab-btn{
    font-family:'Inter', sans-serif;
    font-size:14.5px;
    font-weight:600;
    padding:10px 22px 12px;
    background:#E7E2D2;
    color:var(--text-muted);
    border:1px solid var(--rule);
    border-bottom:none;
    border-radius:10px 10px 0 0;
    cursor:pointer;
    position:relative;
    top:1px;
    white-space:nowrap;
    flex-shrink:0;
  }
  .tab-btn.active{
    background:var(--card);
    color:var(--ink);
    top:0;
    padding-top:11px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--rule);
    border-radius:0 10px 10px 10px;
    box-shadow:0 1px 0 rgba(34,52,75,0.04);
    padding:30px 30px 26px;
  }
  .panel{display:none;}
  .panel.active{display:block;}

  /* --- 입력 폼 --- */
  .field-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
    margin-bottom:16px;
  }
  .field{
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .field.full{grid-column:1 / -1;}
  label{
    font-size:12.5px;
    font-weight:600;
    color:var(--ink-soft);
  }
  label .hint{
    font-weight:400;
    color:var(--text-muted);
  }
  input, select, textarea{
    font-family:'Inter', sans-serif;
    font-size:14.5px;
    padding:9px 11px;
    border:1px solid var(--rule);
    border-radius:6px;
    background:#FEFDFA;
    color:var(--ink);
  }
  input:focus, select:focus, textarea:focus{
    outline:none;
    border-color:var(--ink-soft);
  }
  textarea{resize:vertical; min-height:56px; font-family:'Inter', sans-serif;}
  .menu-check-group{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .menu-check{
    display:flex;
    align-items:center;
    gap:6px;
    padding:8px 16px;
    border:1px solid var(--rule);
    border-radius:20px;
    background:#FEFDFA;
    font-size:14px;
    font-weight:500;
    color:var(--ink-soft);
    cursor:pointer;
    transition:background .12s ease, border-color .12s ease, color .12s ease;
  }
  .menu-check input{
    position:absolute;
    opacity:0;
    width:0; height:0;
  }
  .menu-check:has(input:checked){
    background:var(--accent);
    border-color:var(--accent);
    color:#FBF7EF;
  }
  .menu-duration-hint{
    font-size:11.5px;
    color:var(--text-muted);
    margin-top:2px;
  }
  .edit-banner{
    display:none;
    align-items:center;
    justify-content:space-between;
    background:var(--ochre-bg);
    color:var(--ochre);
    padding:9px 14px;
    border-radius:7px;
    font-size:13px;
    font-weight:600;
    margin-bottom:18px;
  }
  .edit-banner.show{display:flex;}
  .edit-banner button{
    background:none;
    border:none;
    color:var(--ochre);
    font-size:12.5px;
    font-weight:600;
    text-decoration:underline;
    cursor:pointer;
    padding:0;
  }

  /* --- 중복 예약 확인 모달 --- */
  .modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(34,52,75,0.42);
    align-items:center;
    justify-content:center;
    z-index:50;
    padding:20px;
  }
  .modal-overlay.show{display:flex;}
  .modal-card{
    background:var(--card);
    border:1px solid var(--rule);
    border-radius:10px;
    padding:24px 24px 20px;
    max-width:340px;
    width:100%;
    box-shadow:0 8px 28px rgba(34,52,75,0.22);
  }
  .modal-card h3{
    font-family:'Roboto Slab', serif;
    font-size:17px;
    margin:0 0 10px;
    color:var(--ink);
  }
  .modal-card p{
    font-size:13.5px;
    line-height:1.55;
    color:var(--ink-soft);
    margin:0 0 20px;
    white-space:pre-wrap;
  }
  .modal-actions{
    display:flex;
    gap:8px;
    justify-content:flex-end;
  }
  .modal-btn{
    font-family:'Inter', sans-serif;
    font-size:13.5px;
    font-weight:600;
    padding:9px 16px;
    border-radius:6px;
    cursor:pointer;
    border:1px solid transparent;
  }
  .modal-btn.ghost{
    background:#FEFDFA;
    border-color:var(--rule);
    color:var(--ink-soft);
  }
  .modal-btn.ghost:hover{background:#F1EEE3;}
  .modal-btn.solid{
    background:var(--accent);
    color:#FBF7EF;
  }
  .modal-btn.solid:hover{background:var(--accent-dark);}

  .backup-footer{
    max-width:680px;
    margin:14px auto 0;
    padding:0 4px;
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12px;
    color:var(--text-muted);
  }
  .backup-footer .sep{color:var(--rule);}
  .backup-footer button{
    background:none;
    border:none;
    color:var(--ink-soft);
    font-size:12px;
    font-weight:600;
    text-decoration:underline;
    cursor:pointer;
    padding:0;
  }
  .backup-footer button:hover{color:var(--ink);}
  .version-tag{
    margin-left:auto;
    color:#C9C4B4;
    font-weight:600;
    font-variant-numeric:tabular-nums;
  }
  .time-row{display:grid; grid-template-columns:1fr auto 1fr; gap:10px; align-items:end;}
  .time-sep{padding-bottom:10px; color:var(--text-muted); font-size:13px;}

  .submit-btn{
    margin-top:6px;
    width:100%;
    padding:12px;
    background:var(--accent);
    color:#FBF7EF;
    border:none;
    border-radius:7px;
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:15px;
    cursor:pointer;
    transition:background .12s ease;
  }
  .submit-btn:hover{background:var(--accent-dark);}

  .toast{
    margin-top:14px;
    padding:10px 14px;
    border-radius:6px;
    font-size:13.5px;
    display:none;
  }
  .toast.show{display:block;}
  .toast.ok{background:var(--sage-bg); color:var(--sage);}
  .toast.warn{background:var(--ochre-bg); color:var(--ochre);}

  /* --- 조회 --- */
  .date-nav{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:20px;
  }
  .date-nav input[type=date]{flex:1;}
  .nav-btn{
    width:34px; height:34px;
    border:1px solid var(--rule);
    background:#FEFDFA;
    border-radius:6px;
    cursor:pointer;
    font-size:15px;
    color:var(--ink-soft);
  }
  .nav-btn:hover{background:#F1EEE3;}

  .day-count{
    font-size:12.5px;
    color:var(--text-muted);
    padding-left:2px;
  }
  .day-count-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
  }
  .new-rsv-btn{
    font-family:'Inter', sans-serif;
    font-size:12.5px;
    font-weight:600;
    padding:6px 13px;
    background:var(--accent);
    color:#FBF7EF;
    border:none;
    border-radius:16px;
    cursor:pointer;
    transition:background .12s ease;
  }
  .new-rsv-btn:hover{background:var(--accent-dark);}

  .ledger-row{
    display:grid;
    grid-template-columns:74px 1fr auto;
    gap:14px;
    align-items:start;
    padding:14px 4px;
    border-top:1px solid var(--rule);
  }
  .ledger-row:first-of-type{border-top:none;}
  .time-col{
    font-variant-numeric:tabular-nums;
    font-weight:600;
    font-size:14px;
    color:var(--ink);
    padding-top:2px;
  }
  .time-col small{display:block; font-weight:400; color:var(--text-muted); font-size:11.5px; margin-top:2px;}
  .dup-badge{
    display:inline-block;
    margin-top:4px;
    font-size:9.5px;
    font-weight:700;
    color:var(--accent);
    background:var(--ochre-bg);
    padding:1px 5px;
    border-radius:4px;
  }
  .info-col .who{font-weight:600; font-size:14.5px;}
  .info-col .svc{font-size:13px; color:var(--ink-soft); margin-top:2px;}
  .info-col .memo{font-size:12.5px; color:var(--text-muted); margin-top:5px; white-space:pre-wrap;}
  .action-col{display:flex; flex-direction:column; align-items:flex-end; gap:8px;}
  .status-select{
    font-size:12.5px;
    padding:5px 8px;
    border-radius:5px;
    font-weight:600;
    border:1px solid transparent;
  }
  .status-예약{background:var(--ochre-bg); color:var(--ochre);}
  .status-완료{background:var(--sage-bg); color:var(--sage);}
  .status-취소{background:var(--cancel-bg); color:var(--cancel); text-decoration:line-through;}
  .del-btn{
    background:none; border:none; color:var(--text-muted);
    font-size:12px; cursor:pointer; text-decoration:underline;
    padding:0;
  }
  .del-btn:hover{color:var(--accent);}
  .row-actions{display:flex; gap:10px;}
  .edit-btn{
    background:none; border:none; color:var(--ink-soft);
    font-size:12px; cursor:pointer; text-decoration:underline;
    padding:0;
  }
  .edit-btn:hover{color:var(--ink);}

  .empty-state{
    padding:40px 10px;
    text-align:center;
    color:var(--text-muted);
    font-size:14px;
  }
  .empty-state .big{font-size:28px; margin-bottom:8px;}

  /* --- 캘린더 --- */
  .cal-toolbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
  }
  .view-toggle{
    display:flex;
    border:1px solid var(--rule);
    border-radius:7px;
    overflow:hidden;
  }
  .view-toggle-btn{
    font-family:'Inter', sans-serif;
    font-size:13px;
    font-weight:600;
    padding:7px 16px;
    background:#FEFDFA;
    color:var(--text-muted);
    border:none;
    cursor:pointer;
  }
  .view-toggle-btn + .view-toggle-btn{border-left:1px solid var(--rule);}
  .view-toggle-btn.active{background:var(--ink); color:#FBF7EF;}
  .cal-nav{display:flex; align-items:center; gap:6px;}
  .today-btn{width:auto; padding:0 12px; font-size:12.5px; font-weight:600;}
  .cal-period-label{
    font-family:'Roboto Slab', serif;
    font-weight:700;
    font-size:17px;
    color:var(--ink);
    margin-bottom:14px;
  }

  .month-grid{
    display:grid;
    grid-template-columns:repeat(7, 1fr);
    border-top:1px solid var(--rule);
    border-left:1px solid var(--rule);
  }
  .weekday-hd{
    text-align:center;
    font-size:11.5px;
    font-weight:600;
    color:var(--text-muted);
    padding:6px 0;
    border-right:1px solid var(--rule);
    border-bottom:1px solid var(--rule);
    background:#F5F2E8;
  }
  .weekday-hd.sun{color:var(--accent);}
  .weekday-hd.sat{color:var(--sat-blue);}
  .day-cell{
    min-height:88px;
    padding:6px 6px 8px;
    border-right:1px solid var(--rule);
    border-bottom:1px solid var(--rule);
    cursor:pointer;
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .day-cell:hover{background:#F5F2E8;}
  .day-cell.pad{color:#C9C4B4; cursor:default;}
  .day-cell.pad:hover{background:transparent;}
  .day-num{
    font-size:12.5px;
    font-weight:600;
    font-variant-numeric:tabular-nums;
  }
  .day-num.dnum-red{color:var(--accent);}
  .day-num.dnum-blue{color:var(--sat-blue);}
  .holiday-tag{
    font-size:10px;
    color:var(--accent);
    font-weight:600;
    line-height:1.3;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .day-cell.today .day-num{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:20px; height:20px;
    background:var(--accent);
    color:#FBF7EF;
    border-radius:50%;
  }
  .day-chip{
    font-size:10.5px;
    padding:2px 5px;
    border-radius:4px;
    background:var(--ochre-bg);
    color:var(--ochre);
    line-height:1.4;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .day-chip.status-완료{background:var(--sage-bg); color:var(--sage);}
  .day-chip.status-취소{background:var(--cancel-bg); color:var(--cancel); text-decoration:line-through;}
  .day-more{font-size:10.5px; color:var(--text-muted);}
  .day-dots{display:none; gap:3px; flex-wrap:wrap; align-items:center; margin-top:2px;}
  .day-dot{width:6px; height:6px; border-radius:50%; background:var(--ochre); flex-shrink:0;}
  .day-dot.status-완료{background:var(--sage);}
  .day-dot.status-취소{background:var(--cancel);}
  .day-dots .dot-more{font-size:9.5px; color:var(--text-muted); margin-left:1px;}

  .week-grid{
    display:grid;
    grid-template-columns:repeat(7, 1fr);
    gap:10px;
  }
  .week-col{
    border:1px solid var(--rule);
    border-radius:8px;
    min-height:160px;
    overflow:hidden;
  }
  .week-col-hd{
    text-align:center;
    padding:8px 4px;
    background:#F5F2E8;
    border-bottom:1px solid var(--rule);
    cursor:pointer;
  }
  .week-col-hd .dn{font-size:13px; font-weight:700; font-variant-numeric:tabular-nums;}
  .week-col-hd .dn.dnum-red{color:var(--accent);}
  .week-col-hd .dn.dnum-blue{color:var(--sat-blue);}
  .week-col-hd .holiday-tag{margin-top:1px;}
  .week-col.today .week-col-hd .dn{color:var(--accent);}
  .week-col-body{padding:6px; display:flex; flex-direction:column; gap:5px; cursor:pointer; min-height:100px;}
  .week-item{
    font-size:11px;
    padding:4px 6px;
    border-radius:5px;
    background:var(--ochre-bg);
    color:var(--ochre);
    line-height:1.35;
  }
  .week-item .wt{font-weight:700; font-variant-numeric:tabular-nums;}
  .week-item.status-완료{background:var(--sage-bg); color:var(--sage);}
  .week-item.status-취소{background:var(--cancel-bg); color:var(--cancel); text-decoration:line-through;}
  .week-empty{font-size:11px; color:#C9C4B4; text-align:center; padding-top:10px;}

  @media (max-width:520px){
    .day-cell{min-height:64px; padding:4px;}
    .day-chip{display:none;}
    .day-cell .day-more{display:none;}
    .day-dots{display:flex;}
    .week-grid{grid-template-columns:1fr; gap:8px;}
  }

  @media (max-width:520px){
    .field-row{grid-template-columns:1fr;}
    body{padding:20px 10px 60px;}
    .masthead{padding-left:2px; margin-bottom:20px;}
    .masthead h1{font-size:21px;}
    .card{padding:18px 14px 18px;}
    .tabs{padding-left:4px;}
    .tab-btn{font-size:13px; padding:9px 14px 11px;}
    .tab-btn.active{padding-top:10px;}

    /* iOS 자동 확대 방지: 입력 요소 글자 크기 16px 이상 */
    input, select, textarea{font-size:16px;}
    .time-row select{font-size:15px;}

    .cal-toolbar{flex-direction:column; align-items:stretch; gap:10px;}
    .cal-nav{justify-content:space-between;}
    .nav-btn{width:38px; height:38px; font-size:16px;}
    .view-toggle-btn{flex:1; text-align:center; padding:9px 10px;}
    .today-btn{width:auto; flex:0 0 auto; padding:0 14px;}

    .ledger-row{grid-template-columns:60px 1fr; row-gap:8px;}
    .action-col{
      grid-column:1 / -1;
      flex-direction:row;
      align-items:center;
      justify-content:space-between;
      margin-top:2px;
    }
    .row-actions{gap:16px;}
    .edit-btn, .del-btn{font-size:13px;}
    .status-select{font-size:13px; padding:6px 9px;}

    .modal-card{padding:20px 18px 18px;}

    .menu-check{padding:9px 14px; font-size:14.5px;}
    .submit-btn{padding:14px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead">
    <h1>아르고 예약 대장</h1>
    <span id="today-label"></span>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="calendar">캘린더</button>
    <button class="tab-btn" data-tab="input">예약 입력</button>
    <button class="tab-btn" data-tab="search">일자별 조회</button>
  </div>

  <div class="card">
    <!-- 캘린더 패널 -->
    <div class="panel active" id="panel-calendar">
      <div class="cal-toolbar">
        <div class="view-toggle">
          <button class="view-toggle-btn active" data-view="month">월별</button>
          <button class="view-toggle-btn" data-view="week">주별</button>
        </div>
        <div class="cal-nav">
          <button class="nav-btn" id="cal-prev">‹</button>
          <button class="nav-btn today-btn" id="cal-today">오늘</button>
          <button class="nav-btn" id="cal-next">›</button>
        </div>
      </div>
      <div class="cal-period-label" id="cal-period-label"></div>
      <div id="cal-body"></div>
    </div>

    <!-- 입력 패널 -->
    <div class="panel" id="panel-input">
      <div class="edit-banner" id="edit-banner">
        <span>예약 내용을 수정하는 중입니다</span>
        <button type="button" id="cancel-edit-btn">취소하고 새 예약 입력</button>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="f-name">예약자명</label>
          <input type="text" id="f-name" placeholder="예: 김서연">
        </div>
        <div class="field">
          <label for="f-contact">연락처</label>
          <input type="text" id="f-contact" placeholder="선택 입력">
        </div>
      </div>
      <div class="field-row">
        <div class="field full">
          <label>시술 메뉴</label>
          <div class="menu-check-group" id="f-service">
            <label class="menu-check"><input type="checkbox" value="남성컷"><span>남성컷</span></label>
            <label class="menu-check"><input type="checkbox" value="여성컷"><span>여성컷</span></label>
            <label class="menu-check"><input type="checkbox" value="펌"><span>펌</span></label>
            <label class="menu-check"><input type="checkbox" value="컬러"><span>컬러</span></label>
            <label class="menu-check"><input type="checkbox" value="클리닉"><span>클리닉</span></label>
          </div>
          <div class="menu-duration-hint">남성컷·여성컷 30분 / 펌·컬러·클리닉 60분 (여러 개 선택 시 합산)</div>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="f-date">예약 일자</label>
          <input type="date" id="f-date">
        </div>
        <div class="field">
          <label>시간 <span class="hint">(09:00~19:00, 24시간제)</span></label>
          <div class="time-row">
            <select id="f-start"><option value="">선택</option></select>
            <span class="time-sep">~</span>
            <select id="f-end"><option value="">선택</option></select>
          </div>
        </div>
      </div>
      <div class="field-row">
        <div class="field full">
          <label for="f-memo">비고</label>
          <textarea id="f-memo" placeholder="선택 입력"></textarea>
        </div>
      </div>
      <button class="submit-btn" id="submit-btn">예약 등록</button>
      <div class="toast" id="input-toast"></div>
    </div>

    <!-- 중복 예약 확인 모달 -->
    <div class="modal-overlay" id="overlap-modal">
      <div class="modal-card">
        <h3>중복 예약 확인</h3>
        <p id="overlap-modal-msg"></p>
        <div class="modal-actions">
          <button class="modal-btn ghost" id="overlap-cancel">아니오</button>
          <button class="modal-btn solid" id="overlap-confirm">예, 중복 예약</button>
        </div>
      </div>
    </div>

    <!-- 조회 패널 -->
    <div class="panel" id="panel-search">
      <div class="date-nav">
        <button class="nav-btn" id="prev-day">‹</button>
        <input type="date" id="s-date">
        <button class="nav-btn" id="next-day">›</button>
      </div>
      <div class="day-count-row">
        <div class="day-count" id="day-count"></div>
        <button class="new-rsv-btn" id="new-rsv-btn">+ 새 예약</button>
      </div>
      <div id="ledger-list"></div>
    </div>
  </div>

  <div class="backup-footer">
    <span>데이터 백업</span>
    <button type="button" id="export-btn">내보내기</button>
    <span class="sep">·</span>
    <button type="button" id="import-btn">가져오기</button>
    <input type="file" id="import-file" accept="application/json,.json" hidden>
    <span class="version-tag">v1.1</span>
  </div>
</div>

<script>
/*
  아르고 예약 대장 - 버전 기록
  v1.2 (2026-09-03) - 주별 화면 날짜 표기를 "8.30(일)" 형식으로 변경
  v1.1 (2026-09-03) - 버전 표시 추가
  v1.0 - 캘린더(월별/주별), 예약 입력/수정/삭제, 일자별 조회,
         중복예약 확인, 공휴일 표시, 데이터 백업(내보내기/가져오기),
         Firestore 실시간 동기화
*/
const APP_VERSION = '1.2';

// --- Firebase / Firestore 초기화 ---
const firebaseConfig = {
  apiKey: "AIzaSyAFEulxSttgtqQbV6dFJ24t2SxQo1tvlwE",
  authDomain: "argo-reservation.firebaseapp.com",
  projectId: "argo-reservation",
  storageBucket: "argo-reservation.firebasestorage.app",
  messagingSenderId: "296873980132",
  appId: "1:296873980132:web:c3d95f78aec123670efcf1"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const reservationsDocRef = db.collection('argo').doc('reservations');

const OPEN_TIME = '09:00';
const CLOSE_TIME = '19:00';
const MENU_DURATION = { '남성컷':30, '여성컷':30, '펌':60, '컬러':60, '클리닉':60 };
let reservations = [];

function pad(n){ return n.toString().padStart(2,'0'); }
function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}

// --- 대한민국 법정공휴일 ---
// 음력 기반 명절(설날/추석/부처님오신날)과 대체공휴일까지 정확히 반영된 연도: 2025, 2026
const HOLIDAYS_KR = {
  '2025-01-01':'신정',
  '2025-01-28':'설날 연휴',
  '2025-01-29':'설날',
  '2025-01-30':'설날 연휴',
  '2025-03-01':'삼일절',
  '2025-05-05':'어린이날·부처님오신날',
  '2025-05-06':'대체공휴일',
  '2025-06-06':'현충일',
  '2025-08-15':'광복절',
  '2025-10-03':'개천절',
  '2025-10-05':'추석 연휴',
  '2025-10-06':'추석',
  '2025-10-07':'추석 연휴',
  '2025-10-08':'대체공휴일',
  '2025-10-09':'한글날',
  '2025-12-25':'성탄절',
  '2026-01-01':'신정',
  '2026-02-16':'설날 연휴',
  '2026-02-17':'설날',
  '2026-02-18':'설날 연휴',
  '2026-03-01':'삼일절',
  '2026-03-02':'대체공휴일',
  '2026-05-05':'어린이날',
  '2026-05-24':'부처님오신날',
  '2026-05-25':'대체공휴일',
  '2026-06-06':'현충일',
  '2026-08-15':'광복절',
  '2026-08-17':'대체공휴일',
  '2026-09-24':'추석 연휴',
  '2026-09-25':'추석',
  '2026-09-26':'추석 연휴',
  '2026-10-03':'개천절',
  '2026-10-05':'대체공휴일',
  '2026-10-09':'한글날',
  '2026-12-25':'성탄절',
};
// 위 표에 없는 연도(음력 명절 미반영)를 위한 양력 고정일 공휴일 — 참고용 폴백
const FIXED_HOLIDAYS_MD = {
  '01-01':'신정', '03-01':'삼일절', '05-05':'어린이날',
  '06-06':'현충일', '08-15':'광복절', '10-03':'개천절',
  '10-09':'한글날', '12-25':'성탄절',
};
function getHolidayName(dateStr){
  if(HOLIDAYS_KR[dateStr]) return HOLIDAYS_KR[dateStr];
  const year = dateStr.slice(0,4);
  if(year !== '2025' && year !== '2026'){
    const md = dateStr.slice(5);
    if(FIXED_HOLIDAYS_MD[md]) return FIXED_HOLIDAYS_MD[md];
  }
  return null;
}
function dateColorClass(dateObj, dateStr){
  const dow = dateObj.getDay();
  if(getHolidayName(dateStr) || dow === 0) return 'dnum-red';
  if(dow === 6) return 'dnum-blue';
  return '';
}

function fmtDateLabel(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  const days = ['일','월','화','수','목','금','토'];
  const holiday = getHolidayName(dateStr);
  return `${y}. ${pad(m)}. ${pad(d)} (${days[dt.getDay()]})${holiday ? ' · '+holiday : ''}`;
}

function renderActivePanel(){
  const activeBtn = document.querySelector('.tab-btn.active');
  const tab = activeBtn ? activeBtn.dataset.tab : null;
  if(tab === 'calendar') renderCalendar();
  else if(tab === 'search') renderLedger();
}

// --- Firestore 실시간 동기화 ---
// 최초 1회는 초기 데이터 로딩을 기다렸다가 화면을 그리고,
// 이후로는 다른 기기에서 바뀐 내용이 오면 자동으로 다시 그립니다.
function loadReservations(){
  return new Promise((resolve)=>{
    let firstLoad = true;
    reservationsDocRef.onSnapshot((doc)=>{
      const data = doc.exists ? doc.data() : null;
      reservations = (data && Array.isArray(data.list)) ? data.list : [];
      if(firstLoad){
        firstLoad = false;
        resolve();
      }else{
        renderActivePanel();
      }
    }, (err)=>{
      console.error('실시간 동기화 오류', err);
      if(firstLoad){ firstLoad = false; resolve(); }
    });
  });
}
async function saveReservations(){
  try{
    await reservationsDocRef.set({
      list: reservations,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    return true;
  }catch(e){
    console.error('저장 실패', e);
    return false;
  }
}

// --- 데이터 백업(내보내기/가져오기) ---
function exportData(){
  const blob = new Blob([JSON.stringify(reservations, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `아르고예약대장-${todayStr()}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importDataFromFile(file){
  const reader = new FileReader();
  reader.onload = async (e)=>{
    let imported;
    try{
      imported = JSON.parse(e.target.result);
      if(!Array.isArray(imported)) throw new Error('형식 오류');
    }catch(err){
      alert('파일을 읽을 수 없습니다. 올바른 예약 대장 백업 파일(.json)인지 확인해 주세요.');
      return;
    }
    const doReplace = confirm(
      `백업 파일에서 예약 ${imported.length}건을 찾았습니다.\n\n확인(OK): 기존 데이터를 이 내용으로 덮어씁니다\n취소(Cancel): 기존 데이터에 추가로 합칩니다(중복 ID는 건너뜀)`
    );
    if(doReplace){
      reservations = imported;
    }else{
      const existingIds = new Set(reservations.map(r=>r.id));
      imported.forEach(r=>{ if(r && r.id && !existingIds.has(r.id)) reservations.push(r); });
    }
    const ok = await saveReservations();
    if(ok){
      renderCalendar();
      if(document.getElementById('panel-search').classList.contains('active')) renderLedger();
      alert('가져오기가 완료되었습니다.');
    }else{
      alert('저장 중 오류가 발생했습니다.');
    }
  };
  reader.readAsText(file);
}
document.getElementById('export-btn').addEventListener('click', exportData);
document.getElementById('import-btn').addEventListener('click', ()=>{
  document.getElementById('import-file').click();
});
document.getElementById('import-file').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(file) importDataFromFile(file);
  e.target.value = '';
});

// --- 탭 전환 ---
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=> activateTab(btn.dataset.tab));
});
function activateTab(tab){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('panel-'+tab).classList.add('active');
  if(tab === 'search') renderLedger();
  if(tab === 'calendar') renderCalendar();
}
function goToDayView(dateStr){
  sDateInput.value = dateStr;
  activateTab('search');
}
function goToInputTab(dateStr){
  document.getElementById('f-date').value = dateStr;
  activateTab('input');
}

// --- 입력 처리 ---
function showToast(msg, type){
  const t = document.getElementById('input-toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  setTimeout(()=>{ t.classList.remove('show'); }, 2600);
}

function getOverlappingItems(newRsv, excludeId){
  // 1인 시술 기준: 같은 날짜에 시간이 겹치면 시술 메뉴와 무관하게 겹침으로 간주
  return reservations.filter(r=>
    r.id !== excludeId &&
    r.status !== '취소' &&
    r.date === newRsv.date &&
    (newRsv.start < r.end && newRsv.end > r.start)
  );
}

// --- 중복 예약 확인 모달 ---
const overlapModal = document.getElementById('overlap-modal');
function askOverlapConfirm(overlapItems){
  const names = overlapItems.map(r=>`${r.start}~${r.end} ${r.name}님`).join(', ');
  document.getElementById('overlap-modal-msg').textContent =
    `같은 시간대에 이미 예약이 있습니다.\n(${names})\n\n그래도 중복으로 예약하시겠습니까?`;
  overlapModal.classList.add('show');
  return new Promise(resolve=>{
    const onConfirm = ()=>{ cleanup(); resolve(true); };
    const onCancel = ()=>{ cleanup(); resolve(false); };
    function cleanup(){
      overlapModal.classList.remove('show');
      document.getElementById('overlap-confirm').removeEventListener('click', onConfirm);
      document.getElementById('overlap-cancel').removeEventListener('click', onCancel);
    }
    document.getElementById('overlap-confirm').addEventListener('click', onConfirm);
    document.getElementById('overlap-cancel').addEventListener('click', onCancel);
  });
}

function buildTimeOptions(){
  const opts = [];
  for(let h=9; h<=19; h++){
    const maxM = (h===19) ? 0 : 50;
    for(let m=0; m<=maxM; m+=10){
      opts.push(`${pad(h)}:${pad(m)}`);
    }
  }
  return opts;
}
function populateTimeSelects(){
  const opts = buildTimeOptions();
  ['f-start','f-end'].forEach(id=>{
    const sel = document.getElementById(id);
    opts.forEach(t=>{
      const o = document.createElement('option');
      o.value = t; o.textContent = t;
      sel.appendChild(o);
    });
  });
}

function addMinutes(timeStr, mins){
  const [h,m] = timeStr.split(':').map(Number);
  const total = h*60 + m + mins;
  const capped = Math.min(total, 19*60); // 마감 시간(19:00)을 넘지 않도록 제한
  const hh = Math.floor(capped/60);
  const mm = capped % 60;
  return `${pad(hh)}:${pad(mm)}`;
}
function getSelectedMenus(){
  return Array.from(document.querySelectorAll('#f-service input[type=checkbox]:checked')).map(el=>el.value);
}
function computeDurationMinutes(menus){
  if(menus.length === 0) return 30; // 메뉴 미선택 시 기본 30분
  return menus.reduce((sum, m)=> sum + (MENU_DURATION[m] || 60), 0);
}
function updateEndTime(){
  const start = document.getElementById('f-start').value;
  if(!start) return;
  const duration = computeDurationMinutes(getSelectedMenus());
  document.getElementById('f-end').value = addMinutes(start, duration);
}
document.getElementById('f-start').addEventListener('change', updateEndTime);
document.querySelectorAll('#f-service input[type=checkbox]').forEach(cb=>{
  cb.addEventListener('change', updateEndTime);
});

let editingId = null;

function resetInputForm(){
  ['f-name','f-contact','f-memo'].forEach(id=>document.getElementById(id).value='');
  document.querySelectorAll('#f-service input[type=checkbox]').forEach(el=>el.checked=false);
  document.getElementById('f-start').value='';
  document.getElementById('f-end').value='';
  document.getElementById('f-date').value = todayStr();
  editingId = null;
  document.getElementById('submit-btn').textContent = '예약 등록';
  document.getElementById('edit-banner').classList.remove('show');
}

function startEditReservation(id){
  const r = reservations.find(rsv=>rsv.id===id);
  if(!r) return;
  editingId = id;
  document.getElementById('f-name').value = r.name;
  document.getElementById('f-contact').value = r.contact || '';
  document.querySelectorAll('#f-service input[type=checkbox]').forEach(el=>{
    el.checked = Array.isArray(r.service) ? r.service.includes(el.value) : r.service === el.value;
  });
  document.getElementById('f-date').value = r.date;
  document.getElementById('f-start').value = r.start;
  document.getElementById('f-end').value = r.end;
  document.getElementById('f-memo').value = r.memo || '';
  document.getElementById('submit-btn').textContent = '예약 수정';
  document.getElementById('edit-banner').classList.add('show');
  activateTab('input');
}

document.getElementById('cancel-edit-btn').addEventListener('click', resetInputForm);

document.getElementById('submit-btn').addEventListener('click', async ()=>{
  const name = document.getElementById('f-name').value.trim();
  const contact = document.getElementById('f-contact').value.trim();
  const serviceEls = document.querySelectorAll('#f-service input[type=checkbox]:checked');
  const service = Array.from(serviceEls).map(el=>el.value);
  const date = document.getElementById('f-date').value;
  const start = document.getElementById('f-start').value;
  const end = document.getElementById('f-end').value;
  const memo = document.getElementById('f-memo').value.trim();

  if(!name || service.length === 0 || !date || !start || !end){
    showToast('예약자명, 시술 메뉴, 일자, 시간을 모두 입력해 주세요.', 'warn');
    return;
  }
  if(start < OPEN_TIME || end > CLOSE_TIME){
    showToast(`예약 시간은 ${OPEN_TIME}~${CLOSE_TIME} 사이로만 가능합니다.`, 'warn');
    return;
  }
  if(start >= end){
    showToast('종료 시간은 시작 시간보다 늦어야 합니다.', 'warn');
    return;
  }

  const candidate = { name, contact, service, date, start, end, memo };

  const overlaps = getOverlappingItems(candidate, editingId);
  if(overlaps.length > 0){
    const proceed = await askOverlapConfirm(overlaps);
    if(!proceed) return;
  }

  if(editingId){
    const idx = reservations.findIndex(r=>r.id===editingId);
    if(idx === -1){ showToast('수정할 예약을 찾을 수 없습니다.', 'warn'); return; }
    reservations[idx] = { ...reservations[idx], ...candidate };
    const ok = await saveReservations();
    if(ok){
      const savedDate = date;
      resetInputForm();
      goToDayView(savedDate);
    }else{
      showToast('저장 중 오류가 발생했습니다. 다시 시도해 주세요.', 'warn');
    }
    return;
  }

  const newRsv = { id: Date.now().toString(), status:'예약', ...candidate };

  reservations.push(newRsv);
  const ok = await saveReservations();
  if(ok){
    const msg = overlaps.length > 0
      ? `${date} ${start}~${end} 예약이 중복으로 등록되었습니다.`
      : `${date} ${start}~${end} 예약이 등록되었습니다.`;
    showToast(msg, 'ok');
    setTimeout(()=>{
      resetInputForm();
      calRefDate = new Date(date);
      activateTab('calendar');
    }, 850);
  }else{
    showToast('저장 중 오류가 발생했습니다. 다시 시도해 주세요.', 'warn');
  }
});

// --- 조회 처리 ---
const sDateInput = document.getElementById('s-date');

function getDayItems(dateStr){
  return reservations
    .filter(r=>r.date === dateStr)
    .sort((a,b)=> a.start.localeCompare(b.start));
}

function renderLedger(){
  const date = sDateInput.value;
  document.getElementById('day-count').textContent = fmtDateLabel(date);
  const list = document.getElementById('ledger-list');

  const dayItems = getDayItems(date);

  if(dayItems.length === 0){
    list.innerHTML = `<div class="empty-state"><div class="big">—</div>이 날짜에 등록된 예약이 없습니다.</div>`;
    return;
  }

  list.innerHTML = dayItems.map(r=>{
    const isDup = r.status !== '취소' && dayItems.some(other=>
      other.id !== r.id && other.status !== '취소' &&
      r.start < other.end && r.end > other.start
    );
    return `
    <div class="ledger-row" data-id="${r.id}">
      <div class="time-col">${r.start}<small>~${r.end}</small>${isDup ? '<span class="dup-badge">중복</span>' : ''}</div>
      <div class="info-col">
        <div class="who">${escapeHtml(r.name)}${r.contact ? ' · '+escapeHtml(r.contact) : ''}</div>
        <div class="svc">${escapeHtml(Array.isArray(r.service) ? r.service.join(', ') : r.service)}</div>
        ${r.memo ? `<div class="memo">${escapeHtml(r.memo)}</div>` : ''}
      </div>
      <div class="action-col">
        <select class="status-select status-${r.status}" data-id="${r.id}">
          <option value="예약" ${r.status==='예약'?'selected':''}>예약</option>
          <option value="완료" ${r.status==='완료'?'selected':''}>완료</option>
          <option value="취소" ${r.status==='취소'?'selected':''}>취소</option>
        </select>
        <div class="row-actions">
          <button class="edit-btn" data-id="${r.id}">수정</button>
          <button class="del-btn" data-id="${r.id}">삭제</button>
        </div>
      </div>
    </div>
  `;
  }).join('');

  list.querySelectorAll('.status-select').forEach(sel=>{
    sel.addEventListener('change', async (e)=>{
      const id = e.target.dataset.id;
      const rsv = reservations.find(r=>r.id===id);
      rsv.status = e.target.value;
      e.target.className = 'status-select status-' + rsv.status;
      await saveReservations();
    });
  });
  list.querySelectorAll('.edit-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> startEditReservation(btn.dataset.id));
  });
  list.querySelectorAll('.del-btn').forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      const id = e.target.dataset.id;
      reservations = reservations.filter(r=>r.id!==id);
      await saveReservations();
      renderLedger();
    });
  });
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

document.getElementById('prev-day').addEventListener('click', ()=>{
  const d = new Date(sDateInput.value);
  d.setDate(d.getDate()-1);
  sDateInput.value = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  renderLedger();
});
document.getElementById('next-day').addEventListener('click', ()=>{
  const d = new Date(sDateInput.value);
  d.setDate(d.getDate()+1);
  sDateInput.value = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  renderLedger();
});
sDateInput.addEventListener('change', renderLedger);
document.getElementById('new-rsv-btn').addEventListener('click', ()=>{
  goToInputTab(sDateInput.value);
});

// --- 캘린더 ---
let calViewMode = 'month';
let calRefDate = new Date();
const WEEKDAY_LABELS = ['일','월','화','수','목','금','토'];

function toDateStr(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function isSameDate(a,b){ return toDateStr(a) === toDateStr(b); }

document.querySelectorAll('.view-toggle-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    calViewMode = btn.dataset.view;
    document.querySelectorAll('.view-toggle-btn').forEach(b=>b.classList.toggle('active', b===btn));
    renderCalendar();
  });
});
document.getElementById('cal-prev').addEventListener('click', ()=>{
  if(calViewMode === 'month') calRefDate.setMonth(calRefDate.getMonth()-1);
  else calRefDate.setDate(calRefDate.getDate()-7);
  renderCalendar();
});
document.getElementById('cal-next').addEventListener('click', ()=>{
  if(calViewMode === 'month') calRefDate.setMonth(calRefDate.getMonth()+1);
  else calRefDate.setDate(calRefDate.getDate()+7);
  renderCalendar();
});
document.getElementById('cal-today').addEventListener('click', ()=>{
  calRefDate = new Date();
  renderCalendar();
});

function renderCalendar(){
  if(calViewMode === 'month') renderMonthView();
  else renderWeekView();
}

function renderMonthView(){
  const year = calRefDate.getFullYear();
  const month = calRefDate.getMonth();
  document.getElementById('cal-period-label').textContent = `${year}년 ${month+1}월`;

  const firstOfMonth = new Date(year, month, 1);
  const startOffset = firstOfMonth.getDay();
  const gridStart = new Date(year, month, 1 - startOffset);
  const today = new Date();

  let html = `<div class="month-grid">`;
  WEEKDAY_LABELS.forEach((w,i)=>{
    const cls = i===0 ? 'sun' : (i===6 ? 'sat' : '');
    html += `<div class="weekday-hd ${cls}">${w}</div>`;
  });

  for(let i=0; i<42; i++){
    const cellDate = new Date(gridStart);
    cellDate.setDate(gridStart.getDate()+i);
    const inMonth = cellDate.getMonth() === month;
    const dateStr = toDateStr(cellDate);
    const items = getDayItems(dateStr);
    const isToday = isSameDate(cellDate, today);

    if(!inMonth){
      html += `<div class="day-cell pad"><div class="day-num">${cellDate.getDate()}</div></div>`;
      continue;
    }
    const shown = items.slice(0,3);
    const rest = items.length - shown.length;
    const holidayName = getHolidayName(dateStr);
    const colorCls = dateColorClass(cellDate, dateStr);
    const dotItems = items.slice(0,5);
    const dotRest = items.length - dotItems.length;
    html += `<div class="day-cell ${isToday?'today':''}" data-date="${dateStr}">
      <div class="day-num ${colorCls}">${cellDate.getDate()}</div>
      ${holidayName ? `<div class="holiday-tag">${holidayName}</div>` : ''}
      ${shown.map(r=>`<div class="day-chip status-${r.status}" data-date="${dateStr}" data-chip="1">${r.start} ${escapeHtml(r.name)}</div>`).join('')}
      ${rest>0 ? `<div class="day-more" data-date="${dateStr}" data-chip="1">+${rest}건 더보기</div>` : ''}
      ${items.length>0 ? `<div class="day-dots" data-date="${dateStr}" data-chip="1">
        ${dotItems.map(r=>`<span class="day-dot status-${r.status}"></span>`).join('')}
        ${dotRest>0 ? `<span class="dot-more">+${dotRest}</span>` : ''}
      </div>` : ''}
    </div>`;
  }
  html += `</div>`;
  document.getElementById('cal-body').innerHTML = html;

  document.querySelectorAll('#cal-body .day-cell[data-date]').forEach(cell=>{
    cell.addEventListener('click', ()=> goToInputTab(cell.dataset.date));
  });
  document.querySelectorAll('#cal-body [data-chip]').forEach(chip=>{
    chip.addEventListener('click', (e)=>{
      e.stopPropagation();
      goToDayView(chip.dataset.date);
    });
  });
}

function renderWeekView(){
  const start = new Date(calRefDate);
  start.setDate(start.getDate() - start.getDay());
  const end = new Date(start);
  end.setDate(start.getDate()+6);
  const today = new Date();

  const fmtShort = (d)=> `${d.getMonth()+1}.${d.getDate()}`;
  document.getElementById('cal-period-label').textContent = `${fmtShort(start)} ~ ${fmtShort(end)}`;

  let html = `<div class="week-grid">`;
  for(let i=0; i<7; i++){
    const d = new Date(start);
    d.setDate(start.getDate()+i);
    const dateStr = toDateStr(d);
    const items = getDayItems(dateStr);
    const isToday = isSameDate(d, today);
    const holidayName = getHolidayName(dateStr);
    const colorCls = dateColorClass(d, dateStr);

    html += `<div class="week-col ${isToday?'today':''}">
      <div class="week-col-hd" data-date="${dateStr}">
        <div class="dn ${colorCls}">${d.getMonth()+1}.${pad(d.getDate())}(${WEEKDAY_LABELS[d.getDay()]})</div>
        ${holidayName ? `<div class="holiday-tag">${holidayName}</div>` : ''}
      </div>
      <div class="week-col-body" data-date="${dateStr}">
        ${items.length===0 ? `<div class="week-empty">—</div>` :
          items.map(r=>`<div class="week-item status-${r.status}" data-date="${dateStr}" data-chip="1"><span class="wt">${r.start}</span> ${escapeHtml(r.name)}</div>`).join('')}
      </div>
    </div>`;
  }
  html += `</div>`;
  document.getElementById('cal-body').innerHTML = html;

  document.querySelectorAll('#cal-body .week-col-hd[data-date], #cal-body .week-col-body[data-date]').forEach(el=>{
    el.addEventListener('click', ()=> goToInputTab(el.dataset.date));
  });
  document.querySelectorAll('#cal-body [data-chip]').forEach(chip=>{
    chip.addEventListener('click', (e)=>{
      e.stopPropagation();
      goToDayView(chip.dataset.date);
    });
  });
}

  const t = todayStr();

  activateTab('calendar');
})();
</script>
